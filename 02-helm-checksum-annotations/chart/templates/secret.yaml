apiVersion: v1
kind: Secret
# The Deployment template renders and hashes this entire file separately from
# the ConfigMap, making Secret changes easy to identify from the annotations.
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/name: checksum-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  token: {{ .Values.secret.token | quote }}
