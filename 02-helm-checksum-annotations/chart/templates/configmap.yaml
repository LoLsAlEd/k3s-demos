apiVersion: v1
kind: ConfigMap
# The Deployment template renders and hashes this entire file.
# A change to `data` therefore changes the checksum annotation on the Pod.
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: checksum-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  message: {{ .Values.config.message | quote }}
