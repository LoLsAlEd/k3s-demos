apiVersion: v1
kind: Secret
metadata:
  # The Secret has its own versioned name, just like the ConfigMap.
  name: {{ .Release.Name }}-secret-{{ .Values.secret.revision }}
  labels:
    app.kubernetes.io/name: versioned-config-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
    demo.kubernetes.io/secret-revision: {{ .Values.secret.revision | quote }}
type: Opaque
# This version cannot be edited in place. Create a new revision instead.
immutable: true
stringData:
  token: {{ .Values.secret.token | quote }}
