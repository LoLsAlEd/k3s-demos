apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: versioned-config-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versioned-config-demo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versioned-config-demo
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  # ROLLOUT TRIGGER: a new revision changes this Pod-template field.
                  name: {{ .Release.Name }}-config-{{ .Values.config.revision }}
                  key: message
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  # The versioned Secret reference also forms part of the template.
                  name: {{ .Release.Name }}-secret-{{ .Values.secret.revision }}
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/demo
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            # Kubelet mounts the same version selected for DEMO_MESSAGE above.
            name: {{ .Release.Name }}-config-{{ .Values.config.revision }}
