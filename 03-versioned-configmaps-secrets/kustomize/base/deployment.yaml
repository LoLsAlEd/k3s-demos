apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-versioned-demo
  labels:
    app.kubernetes.io/name: kustomize-versioned-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kustomize-versioned-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kustomize-versioned-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  # Kustomize replaces this base name with its generated hash name.
                  name: demo-config
                  key: message
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  # Kustomize also rewrites Secret references automatically.
                  name: demo-secret
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/demo
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            # The generated hash becomes part of the Pod template and rolls Pods.
            name: demo-config
