apiVersion: v1
kind: ConfigMap
# After the hook succeeds, changing this data changes the Deployment checksum
# and starts the application rollout.
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: hook-job-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  message: {{ .Values.config.message | quote }}
