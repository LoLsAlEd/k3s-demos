apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: diff-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # helm-diff renders this value, so a replica change appears in the preview.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: diff-demo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diff-demo
        app.kubernetes.io/instance: {{ .Release.Name }}
      # -----------------------------------------------------------------------
      # ROLLOUT TRIGGER
      # The ConfigMap change also changes this rendered checksum, so the diff
      # previews the Pod-template change that will trigger the rollout.
      # -----------------------------------------------------------------------
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      containers:
        - name: demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: message
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

