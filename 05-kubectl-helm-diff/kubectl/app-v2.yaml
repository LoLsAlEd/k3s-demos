apiVersion: v1
kind: ConfigMap
metadata:
  name: kubectl-diff-demo-config
  namespace: demo-05-diff
data:
  # CHANGED: the diff shows v1 removed and v2 added.
  message: hello from kubectl v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-diff-demo
  namespace: demo-05-diff
  labels:
    app.kubernetes.io/name: kubectl-diff-demo
spec:
  # CHANGED: the proposed Deployment has two Pods.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-diff-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-diff-demo
      # CHANGED: this new Pod-template value triggers a rollout when v2 is applied.
      annotations:
        demo.kubernetes.io/version: v2
    spec:
      containers:
        - name: demo
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: kubectl-diff-demo-config
                  key: message
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

