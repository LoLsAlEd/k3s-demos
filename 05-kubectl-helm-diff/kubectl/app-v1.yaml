apiVersion: v1
kind: ConfigMap
metadata:
  name: kubectl-diff-demo-config
  namespace: demo-05-diff
data:
  # V2 changes this message. `kubectl diff` shows the line before it is applied.
  message: hello from kubectl v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-diff-demo
  namespace: demo-05-diff
  labels:
    app.kubernetes.io/name: kubectl-diff-demo
spec:
  # V2 changes this from one replica to two.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-diff-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-diff-demo
      # V2 adds a version annotation here, which also triggers a rollout.
    spec:
      containers:
        - name: demo
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: kubectl-diff-demo-config
                  key: message
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

