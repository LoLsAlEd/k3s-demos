apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-rollout-demo
  namespace: demo-01-configmap
  labels:
    app.kubernetes.io/name: configmap-rollout-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: configmap-rollout-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configmap-rollout-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: message
          volumeMounts:
            - name: config
              mountPath: /etc/demo
              readOnly: true
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /etc/demo/message
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: demo-config

